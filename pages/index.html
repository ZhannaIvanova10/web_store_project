<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин - Главная</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">🛒 Магазин</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="/">Главная</a>
                <a class="nav-link" href="#">Каталог</a>
                <a class="nav-link" href="#">Категории</a>
                <a class="nav-link" href="#">Контакты</a>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="jumbotron bg-light p-5 rounded">
            <h1 class="display-4">Добро пожаловать!</h1>
            <p class="lead">Лучшие товары по доступным ценам в нашем магазине.</p>
        </div>
        
        <div class="row mt-5">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body text-center">
                        <h5 class="card-title">🎯 Качество</h5>
                        <p class="card-text">Гарантия на все товары</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body text-center">
                        <h5 class="card-title">💰 Цены</h5>
                        <p class="card-text">Самые низкие цены</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body text-center">
                        <h5 class="card-title">🚚 Доставка</h5>
                        <p class="card-text">Быстрая доставка</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
