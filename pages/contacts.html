<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин - Контакты</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 20px; }
        .navbar { margin-bottom: 30px; }
        .card { margin-bottom: 20px; }
    </style>
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">🛒 Магазин</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Главная</a>
                <a class="nav-link" href="#">Каталог</a>
                <a class="nav-link" href="#">Категории</a>
                <a class="nav-link active" href="#">Контакты</a>
            </div>
        </div>
    </nav>

    <!-- Контент -->
    <div class="container">
        <h1 class="mb-4">📞 Контакты</h1>
        <div class="row">
            <!-- Контактная информация -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Наши реквизиты</h5>
                        <ul class="list-unstyled">
                            <li>📍 <strong>Адрес:</strong> г. Москва, ул. Тверская, д. 1</li>
                            <li>📱 <strong>Телефон:</strong> +7 (999) 123-45-67</li>
                            <li>📧 <strong>Email:</strong> info@store.ru</li>
                            <li>⏰ <strong>Режим работы:</strong> Пн-Пт 9:00-20:00</li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <!-- Форма -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Форма обратной связи</h5>
                        <form id="contactForm">
                            <div cla
                        <form id="contactForm">
                            <div class="mb-3">
                                <label class="form-label">Ваше имя</label>
                                <input type="text" class="form-control" name="name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" name="email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Сообщение</label>
                                <textarea class="form-control" name="message" rows="3" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Отправить</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Футер -->
    <footer class="bg-dark text-white mt-5 py-3">
        <div class="container text-center">
            <p class="mb-0">© 2023 Магазин. Все права защищены.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Обработка формы -->
    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const data = {
                name: this.name.value,
                email: this.email.value,
                message: this.message.value
            };
            
            fetch('/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(response => {
                if (response.ok) {
                    alert('✅ Сообщение отправлено!');
                    this.reset();
                }
            });
        });
    </script>
</body>
</html>
